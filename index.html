<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Radiation Bit-Flip Table</title>

  <style>
    :root {
      --background: #ffffff;
      --text: #111111;
      --border: #000000;
      --selected: #DBB13B;
      --neighbor: #BFBFBF;
      --max-table-size: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
      font-family: Bahnschrift, "Arial Narrow", Arial, Helvetica, sans-serif;
    }

    body {
      padding: 18px;
    }

    .page {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
    }

    /* ---------- Interactive 16 x 16 table ---------- */

    #block-grid {
      width: min(96vw, var(--max-table-size));
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
      background: #fff;
    }

    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      user-select: none;
    }

    .cell.valid {
      cursor: pointer;
    }

    .cell.valid:hover {
      outline: 2px solid #000;
      outline-offset: -2px;
      z-index: 2;
    }

    .cell.selected {
      background: var(--selected);
    }

    .cell.neighbor {
      background: var(--neighbor);
    }

    .cell-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5%;
      text-align: center;
    }

    .block-name {
      width: 100%;
      min-height: 2.35em;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      line-height: 1.05;
      font-size: clamp(5px, 0.72vw, 11px);
      font-weight: 400;
    }

    .block-id {
      width: 100%;
      margin-top: 4%;
      white-space: nowrap;
      line-height: 1;
      font-size: clamp(4.5px, 0.60vw, 9px);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    /* ---------- Video + cheat sheet ---------- */

    .media-row {
      width: min(96vw, var(--max-table-size));
      margin: 28px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .media-card {
      width: 100%;
      min-width: 0;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #000;
      display: block;
    }

    .cheat-link {
      display: block;
      width: 100%;
      border: 1px solid #000;
      background: #fff;
      text-decoration: none;
    }

    .cheat-link img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #fff;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .media-row {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 18px;
      }

      .cell-content {
        padding: 2%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section id="block-grid" aria-label="Minecraft block ID bit-flip table"></section>

    <section class="media-row">
      <div class="media-card">
        <iframe
          class="video-frame"
          src="https://www.youtube-nocookie.com/embed/Kd5-1IXqiDQ"
          title="Atomic Frontier Minecraft radiation video"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>

      <div class="media-card">
        <a
          class="cheat-link"
          href="TableCheatSheet_Pretty.png"

          rel="noopener"
          title="Open high-resolution cheat sheet">

            alt="Minecraft block ID cheat sheet">
        </a>
      </div>
    </section>
  </main>

    // Explicit line breaks for the labels highlighted in the reference graphic.
    const DISPLAY_NAMES = {
  "26": "Bed",
  "74": "Glowing\nOre",
  "82": "Clay",
  "88": "Soul\nSand",
  "90": "Nether\nPortal",
  "91": "Jack\no'Lantern",
  "94": "Repeater\n(On)",
  "122": "Dragon\nEgg",
  "218": "Observer"
};

    const SELECTED_ID = 90; // Nether Portal initially selected

    let selectedId = SELECTED_ID;

    function hammingDistance(a, b) {
      let x = (a ^ b) & 0xff;
      let count = 0;

      while (x) {
        count += x & 1;
        x >>>= 1;
      }

      return count;
    }

    function idAsBinary(id) {
      const bits = id.toString(2).padStart(8, "0");
      return `${bits.slice(0, 4)} ${bits.slice(4)}`;
    }

    function displayNameFor(id) {
      if (Object.prototype.hasOwnProperty.call(DISPLAY_NAMES, id)) {
        return DISPLAY_NAMES[id];
      }

      return BLOCK_NAMES[id] || "";
    }

    function isValid(id) {
      return Object.prototype.hasOwnProperty.call(BLOCK_NAMES, id);
    }

    function buildGrid() {
      const grid = document.getElementById("block-grid");

      for (let id = 0; id < 256; id++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.id = id;

        if (isValid(id)) {
          cell.classList.add("valid");

          const content = document.createElement("div");
          content.className = "cell-content";

          const name = document.createElement("div");
          name.className = "block-name";
          name.textContent = displayNameFor(id);

          const binary = document.createElement("div");
          binary.className = "block-id";
          binary.textContent = `${idAsBinary(id)}`;

          content.appendChild(name);
          content.appendChild(binary);
          cell.appendChild(content);

          cell.addEventListener("click", () => {
            selectedId = id;
            refreshHighlights();
          });
        }

        grid.appendChild(cell);
      }

      refreshHighlights();
    }

    function refreshHighlights() {
      const cells = document.querySelectorAll(".cell");

      cells.forEach(cell => {
        const id = Number(cell.dataset.id);

        cell.classList.remove("selected", "neighbor");

        if (id === selectedId) {
          cell.classList.add("selected");
        } else if (isValid(id) && hammingDistance(id, selectedId) === 1) {
          cell.classList.add("neighbor");
        }
      });
    }

    buildGrid();
